[project]
name = "nlp-agent"
version = "1.0.0"
description = "A generic Coordinator/Worker NLP agent derived from Agentic-Travel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "fastapi>=0.116",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-deepseek>=0.1",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "mcp>=1.0",
    "openai>=1.0",
    "pillow>=11.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pymysql>=1.1",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tencentcloud-sdk-python>=3.0",
    "uvicorn[standard]>=0.35",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "rapidocr-onnxruntime>=1.4",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness-critical checks. Formatting enforcement can be enabled
# after the existing codebase has been normalized in a separate change.
# F811 guards against silent redefinitions, which override earlier definitions
# at import time and leave dead code behind.
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts", "tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
