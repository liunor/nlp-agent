services:
  # The only public edge. Nova Web stays on the Compose network and is
  # accessed through this same-origin reverse proxy.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NOVA_WEB_HOST_PORT:-${NOVA_NGINX_HTTP_PORT:-80}}:80"
    restart: unless-stopped
    depends_on:
      nova-web:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${NLP_AGENT_MYSQL_DATABASE:-nlp_agent}
      MYSQL_USER: ${NLP_AGENT_MYSQL_USER:-nlp_agent}
      MYSQL_PASSWORD: ${NLP_AGENT_MYSQL_PASSWORD:?Set NLP_AGENT_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${NLP_AGENT_MYSQL_ROOT_PASSWORD:?Set NLP_AGENT_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Alembic, rather than application code, owns all schema creation and upgrades.
  nova-migrate:
    image: ${NOVA_IMAGE_REF:-nova-agent:local}
    pull_policy: ${NOVA_PULL_POLICY:-build}
    command: [".venv/bin/python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - ${NOVA_ENV_FILE:-.env}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  nova-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NOVA_IMAGE_REF:-nova-agent:local}
    pull_policy: ${NOVA_PULL_POLICY:-build}
    command: [".venv/bin/python", "main.py", "serve"]
    env_file:
      - ${NOVA_ENV_FILE:-.env}
    environment:
      NLP_AGENT_WEB_HOST: 0.0.0.0
      NLP_AGENT_WEB_PORT: 8765
      NLP_AGENT_GATEWAY_TRANSPORT: redis
      NLP_AGENT_REDIS_URL: redis://redis:6379/0
    volumes:
      - nova-data:/app/.data
    restart: unless-stopped
    depends_on:
      nova-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nova-worker:
    image: ${NOVA_IMAGE_REF:-nova-agent:local}
    pull_policy: ${NOVA_PULL_POLICY:-build}
    command: [".venv/bin/python", "main.py", "worker"]
    env_file:
      - ${NOVA_ENV_FILE:-.env}
    environment:
      NLP_AGENT_GATEWAY_TRANSPORT: redis
      NLP_AGENT_REDIS_URL: redis://redis:6379/0
    volumes:
      - nova-data:/app/.data
    restart: unless-stopped
    depends_on:
      nova-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nova-monitor:
    image: ${NOVA_IMAGE_REF:-nova-agent:local}
    pull_policy: ${NOVA_PULL_POLICY:-build}
    command: [".venv/bin/python", "main.py", "monitor"]
    env_file:
      - ${NOVA_ENV_FILE:-.env}
    environment:
      NLP_AGENT_MONITOR_HOST: 0.0.0.0
      NLP_AGENT_MONITOR_PORT: 8766
    ports:
      - "${NOVA_MONITOR_HOST_PORT:-8766}:8766"
    restart: unless-stopped
    profiles: ["monitor"]
    depends_on:
      nova-migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
  redis-data:
  nova-data:
