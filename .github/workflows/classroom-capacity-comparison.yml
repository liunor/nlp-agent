name: Isolated Classroom Capacity Comparison

on:
  push:
    branches: [fix/test-classroom-capacity-batch-20261019]
  pull_request:
    branches: [develop]
    paths:
      - tests/load/**
      - tests/test_capacity_profile.py
      - .github/workflows/classroom-capacity-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement:
    name: Measure ${{ matrix.users }} users - ${{ matrix.replicas }} workers x ${{ matrix.concurrency }} slots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # The four 50-user branch comparisons were already dispatched. Further
        # branch pushes measure the newly requested three-class case; the PR and
        # manual gate always run every topology against the exact reviewed HEAD.
        include: >-
          ${{ fromJSON(github.event_name == 'push'
          && '[{"replicas":2,"concurrency":4,"users":120}]'
          || '[{"replicas":1,"concurrency":1,"users":50},{"replicas":1,"concurrency":2,"users":50},{"replicas":2,"concurrency":2,"users":50},{"replicas":2,"concurrency":4,"users":50},{"replicas":2,"concurrency":4,"users":120}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Measure synthetic users and 30 fake-model tasks
        id: load
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          DEEPSEEK_API_KEY: ''
          QWEN_API_KEY: ''
        run: >-
          uv run python -m tests.load.run_isolated --run-kind regression
          --replicas ${{ matrix.replicas }} --concurrency ${{ matrix.concurrency }}
          --comparison-users ${{ matrix.users }}
          --output artifacts/load-tests/t07/capacity-${{ matrix.replicas }}x${{ matrix.concurrency }}-u${{ matrix.users }}.json
      - name: Require complete measurements and preserve SLO failures
        env:
          REPORT: artifacts/load-tests/t07/capacity-${{ matrix.replicas }}x${{ matrix.concurrency }}-u${{ matrix.users }}.json
          USERS: ${{ matrix.users }}
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open(os.environ['REPORT']))
          permitted = {'Turn submission p95 exceeded the 2 second SLO',
                       'Turn submission p99 exceeded the 5 second SLO',
                       'queue wait p95 exceeded the 120 second SLO'}
          assert set(report['failures']) <= permitted, report['failures']
          assert report['phases']['auth_burst']['login_successes'] == int(os.environ['USERS'])
          assert report['phases']['websocket']['connected'] == int(os.environ['USERS'])
          topology = report['isolated_worker_topology']
          expected = {'observed_replicas': report['deployment_profile']['worker_replicas'],
                      'concurrency_per_replica': report['deployment_profile']['worker_concurrency']}
          assert topology['before'] == topology['after'] == expected
          turns = report['phases']['turn_burst']
          stages = report['submission_diagnostics']['stages']
          assert stages['gateway_submit_total']['count'] >= 34
          assert stages['repository_create_turn']['count'] >= 34
          assert turns['completed'] == 30 and turns['terminal_failures'] == 0
          assert turns['duplicate_terminal_events'] == turns['missing_terminal_events'] == turns['sequence_gaps'] == 0
          print(json.dumps({'measurement_complete': True, 'workload_result': report['result'],
                            'failures': report['failures'], 'profile': report['deployment_profile'],
                            'turns': turns, 'submission_diagnostics': report['submission_diagnostics']}, indent=2))
          if report['failures']:
              print('::warning::Measurement complete, workload SLO failed; this configuration is not accepted.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-capacity-${{ matrix.replicas }}x${{ matrix.concurrency }}-u${{ matrix.users }}
          path: artifacts/load-tests/t07/
          if-no-files-found: error
