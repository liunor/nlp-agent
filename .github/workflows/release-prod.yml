name: Release Production

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nlp-agent
  RUNTIME_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nova-sandbox-runtime

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.source.outputs.digest }}
      runtime_digest: ${{ steps.source.outputs.runtime_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Verify the release tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote the tested candidate without rebuilding
        id: source
        env:
          SOURCE_REF: ${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}
          RELEASE_REF: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          SOURCE_RUNTIME_REF: ${{ env.RUNTIME_IMAGE_NAME }}:release-candidate-${{ github.sha }}
          RELEASE_RUNTIME_REF: ${{ env.RUNTIME_IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "$SOURCE_REF" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          docker buildx imagetools create --tag "$RELEASE_REF" "$SOURCE_REF"
          promoted_digest="$(docker buildx imagetools inspect "$RELEASE_REF" --format '{{.Manifest.Digest}}')"
          test "$promoted_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          runtime_digest="$(docker buildx imagetools inspect "$SOURCE_RUNTIME_REF" --format '{{.Manifest.Digest}}')"
          test -n "$runtime_digest"
          docker buildx imagetools create --tag "$RELEASE_RUNTIME_REF" "$SOURCE_RUNTIME_REF"
          promoted_runtime_digest="$(docker buildx imagetools inspect "$RELEASE_RUNTIME_REF" --format '{{.Manifest.Digest}}')"
          test "$promoted_runtime_digest" = "$runtime_digest"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-and-publish
    runs-on: [self-hosted, linux, production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the immutable release image
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: nova-prod
          NOVA_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/nlp-agent@${{ needs.verify-and-publish.outputs.digest }}
          SANDBOX_RUNTIME_REF: ghcr.io/${{ github.repository_owner }}/nova-sandbox-runtime@${{ needs.verify-and-publish.outputs.runtime_digest }}
          NOVA_PULL_POLICY: always
        run: |
          if [ -z "$DEPLOY_DIR" ]; then
            echo "::error::The deployment directory is not configured on the production environment. Set the DEPLOY_DIR environment variable."
            exit 1
          fi
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::The deployment directory $DEPLOY_DIR does not contain .env. Provision it from deploy/env/production.env.example on the production runner."
            exit 1
          fi
          if [ ! -r "$DEPLOY_DIR/.env" ]; then
            echo "::error::The runner user cannot read $DEPLOY_DIR/.env. Grant the configured Actions runner account read access without exposing the file."
            exit 1
          fi
          DEPLOY_ENV_FILE="$(mktemp)"
          trap 'rm -f "$DEPLOY_ENV_FILE"' EXIT
          awk -v nova_image_ref="$NOVA_IMAGE_REF" -v sandbox_runtime_ref="$SANDBOX_RUNTIME_REF" '
            BEGIN { nova_found = 0; sandbox_found = 0 }
            /^NOVA_IMAGE_REF=/ {
              print "NOVA_IMAGE_REF=\"" nova_image_ref "\""
              nova_found = 1
              next
            }
            /^NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=/ {
              print "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=\"" sandbox_runtime_ref "\""
              sandbox_found = 1
              next
            }
            { print }
            END {
              if (!nova_found) print "NOVA_IMAGE_REF=\"" nova_image_ref "\""
              if (!sandbox_found) print "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=\"" sandbox_runtime_ref "\""
            }
          ' "$DEPLOY_DIR/.env" > "$DEPLOY_ENV_FILE"
          chmod 600 "$DEPLOY_ENV_FILE"
          export NOVA_ENV_FILE="$DEPLOY_ENV_FILE"
          SANDBOX_CONFIGURED_REF="$(awk -F= '$1 == "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST" {sub(/^[^=]*=/, ""); gsub(/^"|"$/, ""); print; exit}' "$DEPLOY_ENV_FILE")"
          test "$SANDBOX_CONFIGURED_REF" = "$SANDBOX_RUNTIME_REF"
          docker pull "$SANDBOX_CONFIGURED_REF"
          test "$NOVA_IMAGE_REF" = "ghcr.io/${{ github.repository_owner }}/nlp-agent@${{ needs.verify-and-publish.outputs.digest }}"
          resolved_images="$(docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml config --images)"
          printf '%s\n' "$resolved_images"
          printf '%s\n' "$resolved_images" | grep -Fxq "$NOVA_IMAGE_REF" || {
            echo "Compose did not resolve the expected published image: $NOVA_IMAGE_REF"
            exit 1
          }
          docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml pull nova-migrate nova-web nova-worker nova-monitor nova-sandbox-manager nginx
          if ! docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml up -d --force-recreate --no-build --remove-orphans nova-migrate nova-web nova-worker nova-monitor nova-sandbox-manager nginx; then
            echo "::error::Compose startup failed; collecting migration diagnostics."
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps || true
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml logs --no-color --tail=200 nova-migrate || true
            exit 1
          fi
          for attempt in {1..12}; do
            if docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nova-web .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nova-monitor .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps --status running --services nova-worker | grep -Fxq "nova-worker" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps --status running --services nova-sandbox-manager | grep -Fxq "nova-sandbox-manager" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nginx wget -q -O - "http://127.0.0.1/health/live" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  sync-gitee:
    needs: deploy
    uses: ./.github/workflows/sync-gitee.yml
    secrets: inherit
