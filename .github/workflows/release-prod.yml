name: Release Production

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nlp-agent
  RUNTIME_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nova-sandbox-runtime

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.source.outputs.digest }}
      runtime_digest: ${{ steps.source.outputs.runtime_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Verify the release tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote the tested candidate without rebuilding
        id: source
        env:
          SOURCE_REF: ${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}
          RELEASE_REF: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          SOURCE_RUNTIME_REF: ${{ env.RUNTIME_IMAGE_NAME }}:release-candidate-${{ github.sha }}
          RELEASE_RUNTIME_REF: ${{ env.RUNTIME_IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          digest="$(docker buildx imagetools inspect "$SOURCE_REF" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          docker buildx imagetools create --tag "$RELEASE_REF" "$SOURCE_REF"
          promoted_digest="$(docker buildx imagetools inspect "$RELEASE_REF" --format '{{.Manifest.Digest}}')"
          test "$promoted_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          runtime_digest="$(docker buildx imagetools inspect "$SOURCE_RUNTIME_REF" --format '{{.Manifest.Digest}}')"
          test -n "$runtime_digest"
          docker buildx imagetools create --tag "$RELEASE_RUNTIME_REF" "$SOURCE_RUNTIME_REF"
          promoted_runtime_digest="$(docker buildx imagetools inspect "$RELEASE_RUNTIME_REF" --format '{{.Manifest.Digest}}')"
          test "$promoted_runtime_digest" = "$runtime_digest"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-and-publish
    runs-on: [self-hosted, linux, production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the immutable release image
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: nova-prod
          NOVA_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/nlp-agent@${{ needs.verify-and-publish.outputs.digest }}
          SANDBOX_RUNTIME_REF: ghcr.io/${{ github.repository_owner }}/nova-sandbox-runtime@${{ needs.verify-and-publish.outputs.runtime_digest }}
          NOVA_PULL_POLICY: always
        run: |
          if [ -z "$DEPLOY_DIR" ]; then
            echo "::error::The deployment directory is not configured on the production environment. Set the DEPLOY_DIR environment variable."
            exit 1
          fi
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::The deployment directory $DEPLOY_DIR does not contain .env. Provision it from deploy/env/production.env.example on the production runner."
            exit 1
          fi
          if [ ! -r "$DEPLOY_DIR/.env" ]; then
            echo "::error::The runner user cannot read $DEPLOY_DIR/.env. Grant the configured Actions runner account read access without exposing the file."
            exit 1
          fi
          DEPLOY_ENV_FILE="$(mktemp)"
          COMPOSE_CONFIG_JSON=""
          trap 'rm -f "$DEPLOY_ENV_FILE"; test -z "$COMPOSE_CONFIG_JSON" || rm -f "$COMPOSE_CONFIG_JSON"' EXIT
          awk -v nova_image_ref="$NOVA_IMAGE_REF" -v sandbox_runtime_ref="$SANDBOX_RUNTIME_REF" '
            BEGIN { nova_found = 0; sandbox_found = 0; web_port_found = 0; monitor_port_found = 0; namespace_found = 0; lock_dir_found = 0; host_lock_found = 0; host_max_found = 0 }
            /^NOVA_IMAGE_REF=/ {
              print "NOVA_IMAGE_REF=\"" nova_image_ref "\""
              nova_found = 1
              next
            }
            /^NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=/ {
              print "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=\"" sandbox_runtime_ref "\""
              sandbox_found = 1
              next
            }
            /^NOVA_WEB_HOST_PORT=/ {
              print "NOVA_WEB_HOST_PORT=\"8765\""
              web_port_found = 1
              next
            }
            /^NOVA_MONITOR_HOST_PORT=/ {
              print "NOVA_MONITOR_HOST_PORT=\"8766\""
              monitor_port_found = 1
              next
            }
            /^NLP_AGENT_SANDBOX_NAMESPACE=/ {
              print "NLP_AGENT_SANDBOX_NAMESPACE=\"prod\""
              namespace_found = 1
              next
            }
            /^NLP_AGENT_SANDBOX_HOST_LOCK_FILE=/ {
              print "NLP_AGENT_SANDBOX_HOST_LOCK_FILE=\"/run/nova-sandbox-lock/host.lock\""
              host_lock_found = 1
              next
            }
            /^NLP_AGENT_SANDBOX_HOST_RUNTIME_TOTAL_MAX=/ {
              print "NLP_AGENT_SANDBOX_HOST_RUNTIME_TOTAL_MAX=\"4\""
              host_max_found = 1
              next
            }
            /^NOVA_SANDBOX_HOST_LOCK_DIR=/ {
              print "NOVA_SANDBOX_HOST_LOCK_DIR=\"/var/lock/nova-sandbox\""
              lock_dir_found = 1
              next
            }
            { print }
            END {
              if (!nova_found) print "NOVA_IMAGE_REF=\"" nova_image_ref "\""
              if (!sandbox_found) print "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST=\"" sandbox_runtime_ref "\""
              if (!web_port_found) print "NOVA_WEB_HOST_PORT=\"8765\""
              if (!monitor_port_found) print "NOVA_MONITOR_HOST_PORT=\"8766\""
              if (!namespace_found) print "NLP_AGENT_SANDBOX_NAMESPACE=\"prod\""
              if (!host_lock_found) print "NLP_AGENT_SANDBOX_HOST_LOCK_FILE=\"/run/nova-sandbox-lock/host.lock\""
              if (!host_max_found) print "NLP_AGENT_SANDBOX_HOST_RUNTIME_TOTAL_MAX=\"4\""
              if (!lock_dir_found) print "NOVA_SANDBOX_HOST_LOCK_DIR=\"/var/lock/nova-sandbox\""
            }
          ' "$DEPLOY_DIR/.env" > "$DEPLOY_ENV_FILE"
          chmod 600 "$DEPLOY_ENV_FILE"
          export NOVA_ENV_FILE="$DEPLOY_ENV_FILE"
          mkdir -p /var/lock/nova-sandbox
          compose_config_json="$(mktemp)"
          COMPOSE_CONFIG_JSON="$compose_config_json"
          docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml config --format json > "$COMPOSE_CONFIG_JSON"
          python3 - "$COMPOSE_CONFIG_JSON" <<'PY'
          import json
          import sys

          config = json.loads(open(sys.argv[1], encoding="utf-8").read())
          services = config["services"]
          def published(service: str) -> int:
              return int(services[service]["ports"][0]["published"])
          web_port, monitor_port = published("nginx"), published("nova-monitor")
          if (web_port, monitor_port) != (8765, 8766) or web_port == monitor_port:
              raise SystemExit(f"production deployment ports are not isolated: web={web_port}, monitor={monitor_port}")
          print(f"Validated production deployment ports: web={web_port}, monitor={monitor_port}")
          PY
          SANDBOX_CONFIGURED_REF="$(awk -F= '$1 == "NLP_AGENT_SANDBOX_DOCKER_IMAGE_DIGEST" {sub(/^[^=]*=/, ""); gsub(/^"|"$/, ""); print; exit}' "$DEPLOY_ENV_FILE")"
          test "$SANDBOX_CONFIGURED_REF" = "$SANDBOX_RUNTIME_REF"
          bash "$GITHUB_WORKSPACE/.github/scripts/run-with-transient-registry-retry.sh" \
            docker pull --quiet "$SANDBOX_CONFIGURED_REF"
          test "$NOVA_IMAGE_REF" = "ghcr.io/${{ github.repository_owner }}/nlp-agent@${{ needs.verify-and-publish.outputs.digest }}"
          resolved_images="$(docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml config --images)"
          printf '%s\n' "$resolved_images"
          printf '%s\n' "$resolved_images" | grep -Fxq "$NOVA_IMAGE_REF" || {
            echo "Compose did not resolve the expected published image: $NOVA_IMAGE_REF"
            exit 1
          }
          bash "$GITHUB_WORKSPACE/.github/scripts/run-with-transient-registry-retry.sh" \
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml pull --quiet nova-migrate nova-web nova-worker nova-monitor nova-sandbox-manager nginx mysql redis
          # Every image needed by this `up` was pulled above. Prevent Compose
          # from issuing a second registry request after a successful pull.
          export NOVA_PULL_POLICY=never
          if ! docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml up -d --force-recreate --no-build --remove-orphans nova-migrate nova-web nova-worker nova-monitor nova-sandbox-manager nginx; then
            echo "::error::Compose startup failed; collecting migration diagnostics."
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps || true
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml logs --no-color --tail=200 nova-migrate || true
            exit 1
          fi
          worker_running=0
          for worker_attempt in {1..12}; do
            if docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps --status running --services nova-worker | grep -Fxq "nova-worker"; then
              worker_running=1
              break
            fi
            sleep 5
          done
          if [ "$worker_running" -ne 1 ]; then
            echo "::error::nova-worker is not running; cannot validate outbound network configuration."
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps || true
            docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml logs --no-color --tail=200 nova-worker || true
            exit 1
          fi
          echo "Proxy connectivity preflight"
          if ! docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nova-worker .venv/bin/python -c '
          import os
          import socket
          import sys
          from urllib.parse import urlsplit

          raw = os.environ.get("NOVA_OUTBOUND_PROXY_URL", "").strip() or os.environ.get("HTTPS_PROXY", "").strip()
          if not raw:
              print("Outbound proxy disabled; skipping proxy connectivity check.")
              raise SystemExit(0)
          parsed = urlsplit(raw)
          try:
              port = parsed.port
          except ValueError:
              port = None
          if parsed.scheme not in {"http", "https"} or not parsed.hostname or not port:
              print("Configured outbound proxy must be an HTTP(S) URL with a host and port.", file=sys.stderr)
              raise SystemExit(1)
          try:
              with socket.create_connection((parsed.hostname, port), timeout=5):
                  pass
          except OSError as error:
              print(f"Outbound proxy is not reachable from the container at {parsed.hostname}:{port}: {error}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Outbound proxy is reachable from the container at {parsed.hostname}:{port}.")
          '; then
            echo "::error::Outbound proxy preflight failed. Ensure the proxy listens on the Docker-reachable host.docker.internal address, not only 127.0.0.1."
            exit 1
          fi
          for attempt in {1..12}; do
            if docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nova-web .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nova-monitor .venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health/ready')" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps --status running --services nova-worker | grep -Fxq "nova-worker" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml ps --status running --services nova-sandbox-manager | grep -Fxq "nova-sandbox-manager" \
              && docker compose --profile monitor -p "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f compose.yaml exec -T nginx wget -q -O - "http://127.0.0.1/health/live" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  sync-gitee:
    needs: deploy
    uses: ./.github/workflows/sync-gitee.yml
    secrets: inherit
