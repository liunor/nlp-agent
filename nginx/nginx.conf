# Nova edge reverse proxy (HTTP bootstrap configuration).
#
# The default published port is loopback-only for a controlled host TLS proxy.
# Explicit direct HTTP development can set NOVA_WEB_BIND_ADDRESS; keep the
# trusted-edge allowlists limited to peers that really are controlled proxies.

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # nova-monitor is an optional Compose profile in local development.  Use
    # Docker's resolver so nginx can start before that profile is enabled and
    # begin routing to it as soon as the service appears.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The published upstream port is loopback-only behind the host TLS proxy.
    # Deployment supplies the exact host gateway in these two allowlists.
    include /etc/nginx/trusted-edge-http.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    geo $realip_remote_addr $nova_trusted_edge {
        default 0;
        include /etc/nginx/trusted-edge-addresses.conf;
    }
    map "$nova_trusted_edge:$http_x_forwarded_proto" $nova_forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Nginx only protects the edge. Nova remains responsible for login,
    # cookies, CSRF, RBAC, and future sandbox authorization.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream nova_web {
        server nova-web:8765;
        keepalive 32;
    }

    upstream nova_monitor {
        zone nova_monitor 64k;
        server nova-monitor:8766 resolve;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # No routes are defined for MySQL, Redis, Worker, or Sandbox.
        limit_conn conn_limit 100;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The monitor is a separate same-origin application.  Strip the
        # public prefix before forwarding so its static SPA is served at / and
        # its API continues to receive the FastAPI /api/v1 routes.
        location = /monitor {
            return 301 /monitor/;
        }

        location /monitor-api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://nova_monitor/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /monitor/ {
            proxy_pass http://nova_monitor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Monitor live diagnostics use the same-origin WebSocket endpoint;
        # keep the student/chat /ws/ routes on nova-web below.
        location = /ws/observability {
            proxy_pass http://nova_monitor;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # proxy_pass has no URI suffix so /ws/v1 reaches Nova unchanged.
        location /ws/ {
            proxy_pass http://nova_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # proxy_pass has no URI suffix so /api/v1 reaches Nova unchanged.
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://nova_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_set_header X-Nova-Artifact-Delivery "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Nova serves the React SPA and its static files at the root path.
        location / {
            proxy_pass http://nova_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $nova_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
